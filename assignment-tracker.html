<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Assignment Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: #f0f2f5;
      color: #1f2328;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #12192b;
      color: #ffffff;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .brand .logo {
      width: 36px;
      height: 36px;
      background: #3b82d4;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    header .tagline {
      font-size: 12px;
      color: #8b9ab5;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── Main layout ── */
    main {
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 24px 60px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #57606a;
      margin-bottom: 16px;
    }

    /* ── Cards ── */
    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1 1 240px;
      border-radius: 14px;
      padding: 28px 28px 24px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: default;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.18);
    }

    .card::after {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
    }

    .card.blue   { background: linear-gradient(135deg, #2563eb, #3b82f6); }
    .card.orange { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .card.green  { background: linear-gradient(135deg, #059669, #10b981); }

    .card .card-icon {
      font-size: 32px;
      margin-bottom: 12px;
      display: block;
    }

    .card .card-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.85;
      margin-bottom: 6px;
    }

    .card .card-value {
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .card .card-sub {
      font-size: 12px;
      opacity: 0.75;
      margin-top: 4px;
    }

    /* ── Checklist ── */
    .checklist-section {
      background: #ffffff;
      border-radius: 14px;
      padding: 28px 32px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .checklist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checklist-header h2 {
      font-size: 17px;
      font-weight: 700;
      color: #12192b;
    }

    .progress-pill {
      background: #f0f2f5;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #57606a;
    }

    .progress-pill span {
      color: #059669;
    }

    .progress-bar-wrap {
      background: #e5e7eb;
      border-radius: 8px;
      height: 6px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #059669, #10b981);
      border-radius: 8px;
      transition: width 0.3s ease;
    }

    .checklist-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checklist-list li label {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #fafafa;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .checklist-list li label:hover {
      background: #f0f2f5;
      border-color: #d1d5db;
    }

    .checklist-list li label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #059669;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checklist-list li label .item-text {
      font-size: 14px;
      font-weight: 500;
      color: #1f2328;
      transition: color 0.15s;
      flex: 1;
    }

    .checklist-list li.done label {
      background: #f0fdf4;
      border-color: #a7f3d0;
    }

    .checklist-list li.done .item-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .checklist-list li label .item-num {
      font-size: 11px;
      font-weight: 700;
      color: #9ca3af;
      min-width: 18px;
      text-align: right;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      background: #e5e7eb;
      color: #57606a;
      white-space: nowrap;
    }

    .done .status-badge {
      background: #d1fae5;
      color: #065f46;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 0 16px; }
      main { margin: 20px auto; padding: 0 12px 40px; }
      .card .card-value { font-size: 36px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="logo">AT</div>
      <div>
        <h1>My Assignment Tracker</h1>
      </div>
    </div>
    <div class="tagline">Assignment Tracking</div>
  </header>

  <!-- Main -->
  <main>

    <!-- Summary Cards -->
    <p class="section-title">Summary</p>
    <section class="cards">

      <div class="card blue">
        <span class="card-icon">👥</span>
        <div class="card-label">Total Students</div>
        <div class="card-value">5</div>
        <div class="card-sub">Registered in this class</div>
      </div>

      <div class="card green">
        <span class="card-icon">✅</span>
        <div class="card-label">Submitted</div>
        <div class="card-value" id="submitted-count">0</div>
        <div class="card-sub">Assignment submitted</div>
      </div>

      <div class="card orange">
        <span class="card-icon">⏳</span>
        <div class="card-label">Not Submitted</div>
        <div class="card-value" id="not-submitted-count">5</div>
        <div class="card-sub">Pending submission</div>
      </div>

    </section>

    <!-- Student Submission Checklist -->
    <p class="section-title">Student Submissions</p>
    <section class="checklist-section">
      <div class="checklist-header">
        <h2>Assignment Submission Checklist</h2>
        <div class="progress-pill">
          <span id="done-count">0</span> of <span id="total-count">5</span> submitted
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
      </div>
      <ul class="checklist-list" id="checklist"></ul>
    </section>

  </main>

  <script>
    const students = [
      "Ahmad Syafiq",
      "Nurul Aisyah",
      "Haziq Danial",
      "Siti Nurfazira",
      "Muhammad Irfan"
    ];

    const list            = document.getElementById("checklist");
    const submittedCard   = document.getElementById("submitted-count");
    const notSubmittedCard= document.getElementById("not-submitted-count");
    const doneCount       = document.getElementById("done-count");
    const progressBar     = document.getElementById("progress-bar");

    function updateCounts() {
      const checked = list.querySelectorAll("input[type=checkbox]:checked").length;
      submittedCard.textContent    = checked;
      notSubmittedCard.textContent = students.length - checked;
      doneCount.textContent        = checked;
      progressBar.style.width      = ((checked / students.length) * 100) + "%";
    }

    students.forEach((name, i) => {
      const li    = document.createElement("li");
      const label = document.createElement("label");

      const checkbox    = document.createElement("input");
      checkbox.type     = "checkbox";
      checkbox.addEventListener("change", function () {
        li.classList.toggle("done", this.checked);
        badge.textContent = this.checked ? "Submitted" : "Not Submitted";
        updateCounts();
      });

      const num       = document.createElement("span");
      num.className   = "item-num";
      num.textContent = String(i + 1).padStart(2, "0");

      const span       = document.createElement("span");
      span.className   = "item-text";
      span.textContent = name;

      const badge       = document.createElement("span");
      badge.className   = "status-badge";
      badge.textContent = "Not Submitted";

      label.appendChild(checkbox);
      label.appendChild(num);
      label.appendChild(span);
      label.appendChild(badge);
      li.appendChild(label);
      list.appendChild(li);
    });

    updateCounts();
  </script>

</body>
</html>
